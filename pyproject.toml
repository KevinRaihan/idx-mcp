[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-mcp"
version = "1.2.0"
description = "MCP server providing Indonesian Stock Exchange (IDX) data to Claude Desktop / Claude Code"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9.0",
    "yfinance>=0.2.55",
    "pandas>=2.0.0",
    "numpy>=1.26",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
idx-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.data" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: test performs a real network call to an upstream data provider",
]
