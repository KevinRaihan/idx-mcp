[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "idx-mcp"
version = "1.0.0"
description = "MCP server providing Indonesian Stock Exchange (IDX) data to Claude Desktop"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "yfinance>=0.2.30",
    "pandas>=2.0.0",
    "pandas-ta",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
]

[project.scripts]
idx-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
